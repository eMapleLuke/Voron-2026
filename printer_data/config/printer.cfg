# 	Displays
#####################################################################


#####################################################################
# 	Macros
#####################################################################

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X150 Y150 Z30 F3600


[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    #G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0  X150 Y300 F3600            ; park nozzle at rear
    BED_MESH_CLEAR
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=chamber TARGET=35
    
    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
    SET_FAN_SPEED FAN=nevermore SPEED=0.0  # Nevermore Filter einschalten


[gcode_macro CLEAN_NOZZLE]

variable_start_x: 65
variable_start_y: 305
variable_start_z: 2.5
variable_wipe_dist: 35
variable_wipe_qty: 4
variable_wipe_spd: 100
variable_raise_distance: 10

gcode:
 {% if "xyz" not in printer.toolhead.homed_axes %}
   G28
 {% endif %}
 
 G90                                            ; absolute positioning
 ## Move nozzle to start position
 G1 X{start_x} Y{start_y} F6000
 G1 Z{start_z} F1500

 ## Wipe nozzle
 {% for wipes in range(1, (wipe_qty + 1)) %}
   G1 X{start_x + wipe_dist} F{wipe_spd * 60}
   G1 X{start_x} F{wipe_spd * 60}
 {% endfor %}

 ## Raise nozzle
 G1 Z{raise_distance}


[gcode_macro M141]
gcode:
    {% set s = params.S|default(0)|float %}
    SET_TEMPERATURE_FAN_TARGET temperature_fan="chamber" target={s}


[gcode_macro HEATSOAK]

gcode:
  #{% set target_bed = params.BED|int %}
  {% set chamber_temp = printer['temperature_fan chamber'].temperature %}  # Chamber-Temperatur abrufen
  
  {% if chamber_temp < 25 %}
    M140 S{target_bed}
    SET_FAN_SPEED FAN=nevermore SPEED=1.0  # Nevermore Filter einschalten
    M117 Soak for 30 min
    G4 P1800000  # 30 Minuten warten (30 * 60 * 1000 ms)
    SET_FAN_SPEED FAN=nevermore SPEED=0.0  # Nevermore Filter ausschalten
    M140 S0   # Druckbett ausschalten
  {% else %}
    M117 Chamber already warm, skipping heat soak
  {% endif %}

